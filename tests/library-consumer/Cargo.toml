[package]
name = "octofhir-library-consumer"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[features]
default = []
core = ["dep:octofhir-core"]
storage = ["dep:octofhir-storage"]
search = ["dep:octofhir-search"]
search-canonical = ["search", "octofhir-search/canonical"]
graphql = ["dep:octofhir-graphql"]
api = ["dep:octofhir-api"]
config = ["dep:octofhir-config", "dep:tokio"]
notifications = ["dep:octofhir-notifications"]
cql = ["dep:octofhir-cql-service"]

[dependencies]
octofhir-core = { path = "../../crates/octofhir-core", default-features = false, optional = true }
octofhir-storage = { path = "../../crates/octofhir-storage", default-features = false, optional = true }
octofhir-search = { path = "../../crates/octofhir-search", default-features = false, optional = true }
octofhir-graphql = { path = "../../crates/octofhir-graphql", default-features = false, optional = true }
octofhir-cql-service = { path = "../../crates/octofhir-cql-service", default-features = false, optional = true }
octofhir-api = { path = "../../crates/octofhir-api", default-features = false, optional = true }
octofhir-config = { path = "../../crates/octofhir-config", default-features = false, optional = true }
octofhir-notifications = { path = "../../crates/octofhir-notifications", default-features = false, optional = true }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt", "time"], optional = true }
