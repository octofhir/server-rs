[package]
name = "octofhir-library-consumer"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[features]
default = []
api = ["dep:octofhir-api"]
config = ["dep:octofhir-config", "dep:tokio"]
notifications = ["dep:octofhir-notifications"]
cql = ["dep:octofhir-cql-service"]

[dependencies]
octofhir-cql-service = { path = "../../crates/octofhir-cql-service", default-features = false, optional = true }
octofhir-api = { path = "../../crates/octofhir-api", default-features = false, optional = true }
octofhir-config = { path = "../../crates/octofhir-config", default-features = false, optional = true }
octofhir-notifications = { path = "../../crates/octofhir-notifications", default-features = false, optional = true }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt", "time"], optional = true }
