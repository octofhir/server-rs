[package]
name = "octofhir-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Unified configuration management system for OctoFHIR server"

[dependencies]
# Workspace dependencies
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros", "fs"] }
tracing = { workspace = true }
time = { workspace = true }
toml = { workspace = true }
notify = { workspace = true }
notify-debouncer-mini = { workspace = true }

# Async traits
async-trait = { workspace = true }

# Encryption
aes-gcm = "0.11"
base64 = "0.23"
getrandom = "0.4"
hex = "0.4"

# Database - using sqlx-core and sqlx-postgres directly to avoid sqlite conflict
sqlx-core = { version = "0.9.0", default-features = false, optional = true, features = [
    "_rt-tokio",
    "_tls-native-tls",
    "json",
    "migrate"
] }
sqlx-postgres = { version = "0.9.0", default-features = false, optional = true, features = [
    "json",
    "chrono",
    "uuid",
    "migrate"
] }

# UUID
uuid = { workspace = true }

# Time
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
aes-gcm-legacy = { package = "aes-gcm", version = "0.10" }
tempfile = { workspace = true }

[features]
default = ["postgres"]
postgres = ["dep:sqlx-core", "dep:sqlx-postgres"]
