[package]
name = "octofhir-auth"
description = "Authentication and authorization module for OctoFHIR"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

# Pattern matching
regex = { workspace = true }
ipnetwork = { workspace = true }

# JWT
# aws-lc-rs backend: constant-time RSA/ECDSA (the RustCrypto rsa crate has
# RUSTSEC-2023-0071, the Marvin timing attack, with no fixed release)
jsonwebtoken = { version = "10", default-features = false, features = ["aws_lc_rs", "use_pem"] }
base64 = "0.23"

# Key generation and parsing (jsonwebtoken doesn't generate keys)
aws-lc-rs = "1"
pem = "4"

# UDAP: certificate chains to community anchors, Subject Alternative Names
rustls-pki-types = { version = "1", features = ["std"] }
rustls-webpki = { version = "0.103", default-features = false, features = ["std", "aws-lc-rs"] }
x509-parser = "0.18"
rand = "0.10"

# PKCE and token hashing
sha2 = "0.11"
hex = "0.4"

# Configuration
humantime-serde = "1"
num_cpus = "1"

# Scripting
rquickjs = { version = "0.14", features = ["parallel"] }

# HTTP client for JWKS fetching
reqwest = { version = "0.13", features = ["json", "form"] }

# HTTP handlers
axum = { workspace = true }
axum-extra = { version = "0.12", features = ["cookie"] }
cookie = { version = "0.18", features = ["percent-encode"] }

# Admin API types

# Core types
octofhir-core = { path = "../octofhir-core" }
octofhir-storage = { path = "../octofhir-storage" }
argon2 = { version = "0.5.3", features = ["std"] }

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
tempfile = { workspace = true }
criterion = { version = "0.8", features = ["async_tokio"] }

[[bench]]
name = "quickjs_bench"
harness = false

[package.metadata.cargo-machete]
# Used by serde(with = "humantime_serde") on public config durations.
ignored = ["humantime-serde"]
