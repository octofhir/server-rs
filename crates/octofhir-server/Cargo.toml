[package]
name = "octofhir-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "HTTP server implementation for OctoFHIR"

[features]
default = ["mimalloc"]
vendored-openssl = ["reqwest/native-tls-vendored"]
mimalloc = ["dep:mimalloc"]

[[bin]]
name = "octofhir-server"
path = "src/main.rs"

[dependencies]
# Environment loading
dotenvy = { workspace = true }

# Local dependencies
octofhir-core = { path = "../octofhir-core", features = ["events"] }
octofhir-config = { path = "../octofhir-config" }
octofhir-db-postgres = { path = "../octofhir-db-postgres" }
octofhir-storage = { path = "../octofhir-storage", features = ["events"] }
octofhir-api = { path = "../octofhir-api" }
octofhir-search = { path = "../octofhir-search", features = ["canonical", "remote-terminology", "watch"] }
octofhir-auth = { path = "../octofhir-auth" }
octofhir-auth-postgres = { path = "../octofhir-auth-postgres" }
octofhir-notifications = { path = "../octofhir-notifications" }
octofhir-notebook = { path = "../octofhir-notebook" }
octofhir-cql-service = { path = "../octofhir-cql-service" }
octofhir-canonical-core = { workspace = true, features = ["http"] }
octofhir-graphql = { path = "../octofhir-graphql", features = ["http"] }
# otter-runtime = "0.1"
octofhir-sof = { workspace = true }
async-trait = { workspace = true }
num_cpus = "1.17"

# Workspace dependencies
axum = { workspace = true, features = ["ws", "multipart"] }
tower = { workspace = true }
tower-http = { workspace = true }
async-lsp = { workspace = true }

# PostgreSQL Language Server
banshee_parser = { workspace = true }
banshee_syntax = { workspace = true }
banshee_hir = { workspace = true }
banshee_completion = { workspace = true }
banshee_format = { workspace = true }
text-size = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-stream = "0.1"
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
memchr = "2"
indexmap = { workspace = true }
config = { workspace = true }
notify = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry-otlp = { workspace = true }
tracing-opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
hostname = { workspace = true }
uuid = { workspace = true }
url = { workspace = true }
ipnetwork = { workspace = true }
time = { workspace = true }
json-patch = { workspace = true }
octofhir-fhirpath = { workspace = true, features = ["lsp", "sql-on-fhir"] }
octofhir-fhir-model = { workspace = true }
octofhir-fhirschema = { workspace = true }
fhir-diff = { workspace = true }
fml-syntax = { workspace = true }
fml-model = { workspace = true }
fml-check = { workspace = true }
ccda-fhir = { workspace = true }
fml-engine = { workspace = true }

# UI embedding
include_dir = "0.7"
mime_guess = "2.0"
quick-xml = "0.42"

# HTTP date parsing/formatting
httpdate = "1.0"

# URL encoding for query string construction
urlencoding = "2.1"

# HTTP client
reqwest = { workspace = true }

# Email (SMTP)
lettre = { version = "0.11", features = ["tokio1-rustls-tls", "smtp-transport", "builder"], default-features = false }

# WebSocket client for proxy
tokio-tungstenite = "0.30"

# Database
# Note: Use sqlx-postgres/sqlx-core directly for database operations
# These provide the PgPool type and query macros without the sqlite conflict
sqlx-core = { version = "0.9.0", default-features = false, features = [
    "_rt-tokio",
    "_tls-native-tls",
    "json",
    "migrate"
] }
sqlx-postgres = { version = "0.9.0", default-features = false, features = [
    "json",
    "chrono",
    "uuid",
    "migrate"
] }
chrono = { version = "0.4", features = ["serde"] }

# Password hashing

# Random generation and encoding for client secrets
rand = "0.10"
hex = "0.4"
sha2 = "0.11"

# Redis caching (optional, for horizontal scaling)
deadpool-redis = "0.23"
redis = { version = "1.2", features = ["tokio-comp", "connection-manager"] }
dashmap = "6.2"  # Concurrent HashMap for L1 cache
arc-swap = "1.9"  # Lock-free atomic pointer swapping for hot paths
moka = { version = "0.12", features = ["future"] }  # LRU cache for lazy schema loading
parking_lot = "0.12"  # High-performance RwLock for operation provider caching
regex.workspace = true
tokio-util = { version = "0.7.18", features = ["compat", "rt"] }

# Prometheus metrics
metrics = "0.24"
metrics-exporter-prometheus = "0.18"
metrics-process = { version = "2.4", features = ["use-gauge-on-cpu-seconds-total"] }  # CPU, memory, threads, fds
promql-parser = "0.11"  # parse dashboard queries to scope them to the configured selector
futures = "0.3.32"

# High-performance allocator (optional, enabled by default)
mimalloc = { version = "0.1", default-features = false, optional = true }
base64 = "0.23"

# Cron scheduling for automation
# croner = "2.0"

# Package extraction for Implementation Guide uploads
tar = "0.4"
flate2 = "1.1"
tempfile = { workspace = true }

[dev-dependencies]
aws-lc-rs = "1"
pem = "4"
wiremock = { workspace = true }
reqwest = { workspace = true }
filetime = { workspace = true }
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres", "redis"] }
