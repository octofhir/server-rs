[package]
name = "octofhir-notifications"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
tokio = { workspace = true, features = ["time"], optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
time = { workspace = true, features = ["serde"] }

# Email
lettre = { version = "0.11", optional = true, features = ["tokio1-rustls-tls", "smtp-transport", "builder"], default-features = false }

# HTTP (for SendGrid, webhooks, Telegram)
reqwest = { version = "0.13", optional = true, features = ["json", "rustls"], default-features = false }

# Webhook HMAC signatures
hmac = { version = "0.13", optional = true }
sha2 = { version = "0.11", optional = true }
hex = { version = "0.4", optional = true }

[features]
# Preserve all existing delivery adapters in a default install. Hosts that only
# queue notifications or render templates can omit the transport clients.
default = ["delivery"]
delivery = ["smtp", "http"]
smtp = ["dep:tokio", "dep:lettre"]
http = ["dep:tokio", "dep:reqwest", "dep:hmac", "dep:sha2", "dep:hex"]
