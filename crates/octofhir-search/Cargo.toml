[package]
name = "octofhir-search"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Search parameter parsing and execution for OctoFHIR server"

[features]
default = []
canonical = ["dep:octofhir-canonical-manager"]
remote-terminology = ["canonical", "octofhir-fhir-model/http-client", "octofhir-fhir-model/caching"]
watch = ["remote-terminology", "dep:notify", "dep:toml", "tokio/fs"]

[dependencies]
# Local dependencies
octofhir-core = { path = "../octofhir-core" }
octofhir-storage = { path = "../octofhir-storage" }

# Canonical manager for loading search parameters from packages
octofhir-canonical-manager = { workspace = true, optional = true }

# FHIR model with terminology support
octofhir-fhir-model = { workspace = true }

# FHIRPath parser — parse SearchParameter expressions to AST for jsonb-path derivation
octofhir-fhirpath = { workspace = true }

# UCUM canonical units for unit-aware quantity search
octofhir-ucum = { version = "0.9.3", default-features = false, features = ["platform-math"] }

# Workspace dependencies
dashmap = { workspace = true }
moka = { version = "0.12", features = ["sync"] }
arc-swap = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
regex = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }

urlencoding = "2.1.3"

# File watching for hot reload
notify = { workspace = true, optional = true }
toml = { workspace = true, optional = true }

# Fast random number generation for probabilistic cache cleanup
fastrand = "2.4"

[dev-dependencies]
tempfile = { workspace = true }
criterion = "0.8"

[[bench]]
name = "date_search"
harness = false
