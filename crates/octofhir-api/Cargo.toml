[package]
name = "octofhir-api"
version = "0.1.1"
edition = "2021"
rust-version.workspace = true
description = "API types for OctoFHIR server"

[dependencies]
axum = { workspace = true, optional = true }
http = "1"
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
thiserror = { workspace = true }
[features]
default = ["http"]
http = ["dep:axum"]
