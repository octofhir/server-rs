[package]
name = "octofhir-cql-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
# Workspace CQL dependencies
octofhir-cql = { workspace = true }
octofhir-cql-types = { workspace = true }
octofhir-cql-eval = { workspace = true }
octofhir-cql-model = { workspace = true }

# Workspace octofhir dependencies
octofhir-storage = { path = "../octofhir-storage" }
octofhir-fhirpath = { workspace = true }
octofhir-fhir-model = { workspace = true }

# Async runtime and utilities
tokio = { workspace = true, features = ["rt", "sync", "time"] }
async-trait = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
indexmap = { workspace = true }

# Decimal arithmetic (for CQL Decimal type) - matches CQL types
bigdecimal = "0.4"
num-traits = "0.2"

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Caching
dashmap = { workspace = true }

# Redis (optional L2 cache)
deadpool-redis = { version = "0.23", optional = true }

# Base64 encoding/decoding for CQL content
base64 = "0.23"

# Logging
tracing = { workspace = true }

# Time handling
time = { workspace = true }

[features]
default = []
redis-cache = ["dep:deadpool-redis"]
# The old implicit feature never enabled L2 cache APIs; keep selector compatibility.

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
