[workspace]
resolver = "3"
members = [
    "crates/octofhir-api",
    "crates/octofhir-auth",
    "crates/octofhir-auth-postgres",
    "crates/octofhir-config",
    "crates/octofhir-core",
    "crates/octofhir-cql-service",
    "crates/octofhir-db-postgres",
    "crates/octofhir-graphql",
    "crates/octofhir-notebook",
    "crates/octofhir-notifications",
    "crates/octofhir-search",
    "crates/octofhir-server",
    "crates/octofhir-storage",
    "crates/octofhir-cli",
]

[workspace.package]
version = "0.0.6"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
authors = ["OctoFHIR Team <funyloony@gmail.com>"]
repository = "https://github.com/octofhir/server-rs"
keywords = ["fhir", "healthcare", "server", "api"]
categories = ["web-programming", "science"]

[workspace.dependencies]
# Local dependencies
octofhir-auth = { path = "crates/octofhir-auth" }
octofhir-core = { path = "crates/octofhir-core" }
octofhir-sof = { version = "0.3.5", default-features = false, features = ["parquet", "guard"] }
octofhir-storage = { path = "crates/octofhir-storage" }
octofhir-canonical-core = { version = "0.2.13", default-features = false }
octofhir-fhir-model = { version = "0.1.19", default-features = false, features = ["serde"] }

# async-lsp for SQL language server (better state management than tower-lsp)
async-lsp = { version = "0.2", features = ["tokio"] }

banshee_parser = "0.2.8"
banshee_syntax = "0.2.8"
banshee_hir = "0.2.8"
banshee_completion = "0.2.8"
banshee_format = "0.2.8"
text-size = "1.1"

# Test utilities
filetime = "0.2"

# CLI
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.13.3", features = ["json", "query"] }
dirs = "7"
colored = "3"
tabled = "0.22"

# Core dependencies
tokio = { version = "1", default-features = false }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"

# HTTP server
axum = { version = "0.8", features = ["json",  "macros"] }
tower = { version = "0.5", features = ["timeout", "load-shed", "limit", "util"] }
tower-http = { version = "0.7", features = ["trace", "cors", "compression-gzip"] }

# Storage and concurrency
dashmap = "6.2"  # For some auxiliary maps if needed
arc-swap = "1.9"  # Lock-free atomic pointer swapping
uuid = { version = "1.23", features = ["v4", "v7", "serde"] }

# Time handling
time = { version = "0.3", features = ["serde", "macros", "parsing", "formatting"] }

# Configuration
config = "0.15"
toml = "1.1"
notify = "8"
notify-debouncer-mini = "0.7"

# Logging and observability
tracing = { version = "0.1", features = ["release_max_level_info"] }
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry", "json"] }
opentelemetry = { version = "0.33", features = ["trace"] }
opentelemetry-otlp = { version = "0.33", features = ["http-proto", "reqwest"] }
tracing-opentelemetry = "0.34"
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio"] }
hostname = "0.4"

# JSON Patch (RFC 6902)
json-patch = "4"

octofhir-fhirpath = { version = "0.5.9", default-features = false }
octofhir-fhirschema = { version = "0.3.42", default-features = false }
fhir-toolbox = { version = "0.1.0", default-features = false }
fhir-diff = { version = "0.1.2", default-features = false }

octofhir-cql = { version = "0.2.5", default-features = false }
octofhir-cql-types = { version = "0.2.5" }
octofhir-cql-eval = { version = "0.2.5" }
octofhir-cql-model = { version = "0.2.5" }

# FHIR Mapping Language (StructureMap $transform)
fml-syntax = { version = "0.2.6" }
fml-model = { version = "0.2.6" }
fml-check = { version = "0.2.6", features = ["fhirschema"] }
fml-engine = { version = "0.2.6", features = ["fhirpath"] }
fml-lsp = { version = "0.2.6" }
ccda-fhir = { version = "0.1.2", default-features = false }

# Environment
dotenvy = "0.15"

# Utilities
futures-util = "0.3"
regex = "1"
ipnetwork = "0.21"
url = { version = "2.5", features = ["serde"] }
indexmap = "2"
async-trait = "0.1"

# Development dependencies
tempfile = "3"
wiremock = "0.6"

[profile.dev]
incremental = true
debug = 2

# Dependencies (FHIRPath, validation, FML, serde, sqlx, …) built with optimizations even in debug
# builds: they otherwise run 5–10 times slower, and they change rarely, so they are compiled
# once. The workspace's own crates stay unoptimized for fast rebuilds.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
debug = 1  # full symbol table (no types) — needed for samply name resolution

[profile.bench]
inherits = "release"
debug = true

# Fast-iterating profiling build: near-release codegen (opt-level 3) but thin LTO
# and parallel codegen units so the instrument→rebuild→profile loop is ~3-4x faster
# than the fat-LTO release profile. Use: cargo build --profile profiling
[profile.profiling]
inherits = "release"
lto = "thin"
codegen-units = 16
debug = 2

