name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  actions: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      OCTOFHIR_EMBED_GIT_INFO: "0"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_BUILD_JOBS: "2"
      RUST_TEST_THREADS: "2"

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: octofhir
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Find legacy build cache
        id: legacy-build-cache
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          legacy_build_cache_key=$(gh api "repos/$GITHUB_REPOSITORY/actions/caches?per_page=100" |
            jq -r --arg runner_os "$RUNNER_OS" '[.actions_caches[] |
              select(.ref == "refs/heads/main") |
              select(.key | test("^" + $runner_os + "-cargo-[0-9a-f]{64}$"))] |
              sort_by(.created_at) | last | .key // empty')
          printf 'key=%s\n' "$legacy_build_cache_key" >> "$GITHUB_OUTPUT"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-
            ${{ steps.legacy-build-cache.outputs.key }}

      # FHIR packages the integration tests install; saves downloads from packages.fhir.org.
      - name: Cache FHIR packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.fcm
            ~/.fhir/packages
          key: ${{ runner.os }}-fhir-packages-${{ hashFiles('octofhir.toml') }}
          restore-keys: ${{ runner.os }}-fhir-packages-

      - name: Create UI dist placeholder
        run: |
          mkdir -p ui/dist
          echo '<!DOCTYPE html><html><body>Placeholder</body></html>' > ui/dist/index.html

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Independent library consumers
        run: bash scripts/check-library-deps.sh

      - name: Minimal library feature matrix
        run: |
          for package in octofhir-api octofhir-config octofhir-notifications octofhir-core octofhir-storage octofhir-search octofhir-graphql; do
            cargo test --locked -p "$package" --no-default-features
            cargo clippy --locked -p "$package" --no-default-features --all-targets -- -D warnings
          done
          cargo test --locked -p octofhir-notifications --no-default-features --features smtp
          cargo test --locked -p octofhir-notifications --no-default-features --features http

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --all-features --no-deps

      - name: Test
        env:
          RUST_LOG: info
          # Ensure canonical online tests remain skipped unless explicitly enabled
          OCTOFHIR_TEST_CANONICAL_ONLINE: "0"
          # PostgreSQL connection settings for CI
          OCTOFHIR__STORAGE__POSTGRES__HOST: localhost
          OCTOFHIR__STORAGE__POSTGRES__PORT: "5432"
          OCTOFHIR__STORAGE__POSTGRES__USER: postgres
          OCTOFHIR__STORAGE__POSTGRES__PASSWORD: postgres
          OCTOFHIR__STORAGE__POSTGRES__DATABASE: octofhir
        # Run every test binary so one red run lists every failure.
        run: cargo test --locked --all --all-features --no-fail-fast

