name: Feature request
description: Suggest something OctoFHIR should do.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How it could work. Links to the FHIR spec or other servers help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds you use now
