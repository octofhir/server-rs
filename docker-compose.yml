services:
  postgres:
    image: postgres:18-alpine
    container_name: octofhir-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: octofhir
    command:
      - "postgres"
      # Memory (tuned for ~8GB RAM dev machine)
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "effective_cache_size=2GB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "temp_buffers=16MB"
      # WAL
      - "-c"
      - "wal_buffers=16MB"
      # Resource tables run into the gigabytes and no update can be HOT, so
      # every write dirties pages across several indexes. A small max_wal_size
      # means frequent checkpoints, and each checkpoint makes the next touch of
      # every page emit a full-page image — the write amplification dwarfs the
      # actual change.
      - "-c"
      - "max_wal_size=8GB"
      - "-c"
      - "min_wal_size=1GB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      # Those full-page images are jsonb-heavy and compress well.
      - "-c"
      - "wal_compression=zstd"
      # Query planner (SSD-optimized)
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      # Parallelism
      - "-c"
      - "max_parallel_workers_per_gather=2"
      - "-c"
      - "max_parallel_workers=4"
      - "-c"
      - "max_parallel_maintenance_workers=2"
      # Disable JIT for OLTP (FHIR CRUD workload)
      - "-c"
      - "jit=off"
      # Logging (dev: log queries slower than 500ms)
      - "-c"
      - "log_min_duration_statement=500"
      - "-c"
      - "log_checkpoints=on"
      - "-c"
      - "log_lock_waits=on"
      # Autovacuum
      - "-c"
      - "autovacuum_naptime=10s"
      - "-c"
      - "autovacuum_vacuum_scale_factor=0.05"
      - "-c"
      - "autovacuum_analyze_scale_factor=0.02"
    ports:
      - "5450:5432"
    volumes:
      - octofhir_postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d octofhir"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - octofhir-network

  # Redis cache for horizontal scaling (non-default port for local dev)
  redis:
    image: redis:7-alpine
    container_name: octofhir-redis
    command: redis-server --port 6380
    ports:
      - "6380:6380"
    volumes:
      - octofhir_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - octofhir-network

  # Prometheus for the console's Performance dashboards (non-default port for local dev).
  # Scrapes the server on the host every 5 s; see deploy/observability/prometheus.yml.
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: octofhir-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    ports:
      - "9095:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - octofhir_prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - octofhir-network

  # Optional Grafana for trying the console's "Export to Grafana" (docker compose --profile grafana up -d).
  # http://localhost:3030, admin / admin; Prometheus is provisioned as its datasource.
  grafana:
    image: grafana/grafana:12.1.1
    container_name: octofhir-grafana
    profiles: ["grafana"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: system
    ports:
      - "3030:3000"
    volumes:
      - ./deploy/observability/grafana-datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - octofhir_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - octofhir-network

volumes:
  octofhir_postgres18_data:
  octofhir_redis_data:
  octofhir_prometheus_data:
  octofhir_grafana_data:

networks:
  octofhir-network:
    driver: bridge
